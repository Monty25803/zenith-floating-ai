<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520">
  <defs>
    <linearGradient id="panel3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="880" height="520" rx="18" fill="#0b1220"/>
  <rect x="120" y="40" width="640" height="440" rx="20" fill="url(#panel3)" stroke="#475569"/>
  <text x="150" y="80" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Settings</text>
  <text x="150" y="110" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">API key is stored only on this PC - not sent to a Zenith server.</text>
  <text x="150" y="150" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="11">GEMINI API KEY</text>
  <rect x="150" y="160" width="460" height="40" rx="12" fill="#020617" stroke="#334155"/>
  <text x="168" y="186" fill="#64748b" font-family="Consolas, monospace" font-size="14">************************</text>
  <rect x="620" y="160" width="70" height="40" rx="12" fill="#1e293b"/>
  <text x="655" y="186" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Show</text>
  <rect x="150" y="220" width="90" height="34" rx="8" fill="#7C3AED"/>
  <text x="195" y="242" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Save key</text>
  <rect x="250" y="220" width="70" height="34" rx="8" fill="#1e293b"/>
  <text x="285" y="242" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">Clear</text>
  <rect x="330" y="220" width="110" height="34" rx="8" fill="#6d28d9"/>
  <text x="385" y="242" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Get API key</text>
  <rect x="150" y="280" width="540" height="150" rx="14" fill="#020617" stroke="#334155"/>
  <text x="170" y="310" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">How to get a key</text>
  <text x="170" y="340" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">1. Open Google AI Studio</text>
  <text x="170" y="365" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">2. Sign in with Google</text>
  <text x="170" y="390" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">3. Create API key, copy, paste here, Save</text>
  <text x="120" y="505" fill="#a78bfa" font-family="Segoe UI, Arial, sans-serif" font-size="14">3. Manage your Gemini API key in the app UI</text>
