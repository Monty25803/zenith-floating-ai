<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Zenith logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="orb"><circle cx="120" cy="120" r="76"/></clipPath>

    <radialGradient id="base" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#241A63"/>
      <stop offset="0.7" stop-color="#0B0A2E"/>
      <stop offset="1" stop-color="#03030F"/>
    </radialGradient>

    <!-- inner edge shadow for depth -->
    <radialGradient id="edge" cx="50%" cy="50%" r="50%">
      <stop offset="0.72" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>

    <!-- glass reflection -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- bottom rim light -->
    <radialGradient id="rim" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#F0ABFC" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#F0ABFC" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#C4B5FD" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EC4899"/><stop offset="0.5" stop-color="#A855F7"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/><stop offset="0.5" stop-color="#F472B6"/><stop offset="1" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="b6" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b2" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="b18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="b4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- Aura: layered glows -->
  <circle cx="120" cy="126" r="90" fill="#7C3AED" opacity="0.40" filter="url(#b18)"/>
  <circle cx="92" cy="104" r="60" fill="#22D3EE" opacity="0.30" filter="url(#b18)"/>
  <circle cx="150" cy="150" r="60" fill="#EC4899" opacity="0.30" filter="url(#b18)"/>

  <!-- Orbiting ring with traveling dots -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="14s" repeatCount="indefinite"/>
    <circle cx="120" cy="120" r="94" fill="none" stroke="url(#ring)" stroke-width="1.6" stroke-dasharray="2 5 40 5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="120" cy="26" r="4" fill="#22D3EE"/>
    <circle cx="120" cy="26" r="9" fill="#22D3EE" opacity="0.5" filter="url(#b4)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 120 120" to="0 120 120" dur="20s" repeatCount="indefinite"/>
    <circle cx="120" cy="120" r="102" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="1 7"/>
    <circle cx="222" cy="120" r="3" fill="#EC4899"/>
    <circle cx="222" cy="120" r="8" fill="#EC4899" opacity="0.5" filter="url(#b4)"/>
  </g>

  <!-- Orb body -->
  <circle cx="120" cy="120" r="76" fill="url(#base)"/>

  <g clip-path="url(#orb)">
    <!-- soft color clouds -->
    <g style="mix-blend-mode:screen" filter="url(#b18)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="10s" repeatCount="indefinite"/>
        <circle cx="86" cy="92" r="30" fill="#22D3EE" opacity="0.8"/>
        <circle cx="156" cy="150" r="30" fill="#EC4899" opacity="0.8"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360 120 120" to="0 120 120" dur="15s" repeatCount="indefinite"/>
        <circle cx="154" cy="90" r="26" fill="#6366F1" opacity="0.85"/>
        <circle cx="88" cy="152" r="26" fill="#A855F7" opacity="0.85"/>
      </g>
    </g>

    <!-- Flowing wave ribbons -->
    <g style="mix-blend-mode:screen">
      <!-- ribbon 1 -->
      <g transform="translate(0 112)">
        <g filter="url(#b6)" opacity="0.9">
          <path d="M-60 0 Q-40 -50 -20 0 T20 0 T60 0 T100 0 T140 0 T180 0 T220 0 T260 0 T300 0" fill="none" stroke="url(#w1)" stroke-width="10" stroke-linecap="round">
            <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="4s" repeatCount="indefinite"/>
          </path>
        </g>
        <path d="M-60 0 Q-40 -50 -20 0 T20 0 T60 0 T100 0 T140 0 T180 0 T220 0 T260 0 T300 0" fill="none" stroke="#E0F2FE" stroke-width="2.2" stroke-linecap="round" filter="url(#b2)">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="4s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- ribbon 2 -->
      <g transform="translate(0 128)">
        <g filter="url(#b6)" opacity="0.9">
          <path d="M-60 0 Q-40 40 -20 0 T20 0 T60 0 T100 0 T140 0 T180 0 T220 0 T260 0 T300 0" fill="none" stroke="url(#w2)" stroke-width="9" stroke-linecap="round">
            <animateTransform attributeName="transform" type="translate" from="-80 0" to="0 0" dur="5.5s" repeatCount="indefinite"/>
          </path>
        </g>
        <path d="M-60 0 Q-40 40 -20 0 T20 0 T60 0 T100 0 T140 0 T180 0 T220 0 T260 0 T300 0" fill="none" stroke="#FCE7F3" stroke-width="2" stroke-linecap="round" filter="url(#b2)">
          <animateTransform attributeName="transform" type="translate" from="-80 0" to="0 0" dur="5.5s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- ribbon 3 -->
      <g transform="translate(0 120)">
        <g filter="url(#b6)" opacity="0.8">
          <path d="M-60 0 Q-40 -32 -20 0 T20 0 T60 0 T100 0 T140 0 T180 0 T220 0 T260 0 T300 0" fill="none" stroke="url(#w3)" stroke-width="7" stroke-linecap="round">
            <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="7s" repeatCount="indefinite"/>
          </path>
        </g>
        <path d="M-60 0 Q-40 -32 -20 0 T20 0 T60 0 T100 0 T140 0 T180 0 T220 0 T260 0 T300 0" fill="none" stroke="#FEF3C7" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.9" filter="url(#b2)">
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="7s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- bottom rim light -->
    <circle cx="120" cy="120" r="76" fill="url(#rim)"/>

    <!-- luminous core -->
    <circle cx="120" cy="120" r="40" fill="url(#core)">
      <animate attributeName="r" values="36;44;36" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- edge depth -->
    <circle cx="120" cy="120" r="76" fill="url(#edge)"/>

    <!-- glass reflection -->
    <ellipse cx="120" cy="76" rx="52" ry="26" fill="url(#gloss)" opacity="0.7"/>
  </g>

  <!-- Brand glyph: stacked peak (Zenith) -->
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#b2)" opacity="0.95">
    <path d="M104 112 L120 94 L136 112"/>
    <path d="M104 126 L120 108 L136 126" opacity="0.6"/>
    <path d="M104 140 L120 122 L136 140" opacity="0.3"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 112 L120 94 L136 112"/>
    <path d="M104 126 L120 108 L136 126" opacity="0.6"/>
    <path d="M104 140 L120 122 L136 140" opacity="0.3"/>
  </g>

  <!-- Glass rim -->
  <circle cx="120" cy="120" r="75.5" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="120" cy="120" r="72" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Sparkles -->
  <g fill="#fff">
    <path d="M200 44 L202 52 L210 54 L202 56 L200 64 L198 56 L190 54 L198 52 Z">
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M36 168 L37.5 173 L42.5 174.5 L37.5 176 L36 181 L34.5 176 L29.5 174.5 L34.5 173 Z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <circle cx="48" cy="52" r="1.8" opacity="0.8"/>
    <circle cx="206" cy="190" r="1.6" opacity="0.7"/>
  </g>
</svg>
